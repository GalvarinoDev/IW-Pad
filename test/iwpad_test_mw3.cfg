// IW-Pad test kit for MW3 SP. Put in the game's main/ folder, then in the console: exec iwpad_test_mw3
// The retail MW3 exe has no god/notarget/give; noclip, timescale and restarts work in devmap levels.

// Jumps: type e.g.  vstr manhattan
set manhattan "devmap ny_manhattan"
set prague    "devmap prague_escape"
set dubai     "devmap dubai"
set nostart   "set start none"

// Cheats on F6/F8/F9 (map the Deck back grips to these in Steam Input)
bind F6 "noclip"
bind F8 "toggle timescale 1 0.25"
bind F9 "fast_restart"

// Remove the test binds again (they are saved to config.cfg): vstr testoff
set testoff "unbind F6; unbind F8; unbind F9; set timescale 1; set start none"
