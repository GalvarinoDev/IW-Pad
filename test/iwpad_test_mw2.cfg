// IW-Pad test kit for MW2 SP. Put in the game's main/ folder, then in the console: exec iwpad_test_mw2
// Cheats only work in levels loaded with devmap (the jumps below do that).

// Jumps to the sections on the test list: type e.g.  vstr climb
set climb    "set start climb; devmap cliffhanger"
set crawl    "set start crawl; devmap ending"
set gundrop  "set start gun_drop; devmap ending"
set predator "set start base; devmap contingency"
set breach   "set start deck1; devmap oilrig"
set nostart  "set start none"

// Cheats on F5-F9 (map the Deck back grips to these in Steam Input)
bind F5 "god"
bind F6 "noclip"
bind F7 "notarget"
bind F8 "toggle timescale 1 0.25"
bind F9 "fast_restart"

// Remove the test binds again (they are saved to config.cfg): vstr testoff
set testoff "unbind F5; unbind F6; unbind F7; unbind F8; unbind F9; set timescale 1; set start none"
